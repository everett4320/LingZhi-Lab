<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lingzhi Lab</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lingzhi Lab" />

    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1e3048" />
    <meta name="msapplication-TileColor" content="#1e3048" />

    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (async () => {
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);

        if ('serviceWorker' in navigator) {
          if (isLocalhost) {
            // Dev safety: remove stale SW/caches left from previous PWA runs.
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));

              if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
              }
            } catch (error) {
              console.warn('Failed to clean service workers/caches in dev:', error);
            }
          } else {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                  console.log('SW registered:', registration);
                })
                .catch((registrationError) => {
                  console.log('SW registration failed:', registrationError);
                });
            });
          }
        }
      })();
    </script>
  </body>
</html>
