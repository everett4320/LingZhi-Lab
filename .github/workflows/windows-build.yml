name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/windows-build-*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        env:
          LINGZHI_BUNDLED_OPENAI_API_KEY: 'sk-VxbZuy69vQFmrba6F01034B51548486eB13fAbA8A243B468'
          LINGZHI_REQUIRE_BUNDLED_API_KEY: '1'
        run: npm run desktop:dist -- --win nsis --publish never

      - name: Smoke test packaged Codex provider
        shell: pwsh
        env:
          LINGZHI_BUNDLED_OPENAI_API_KEY: 'sk-VxbZuy69vQFmrba6F01034B51548486eB13fAbA8A243B468'
        run: |
          $codexExe = (Resolve-Path 'release/win-unpacked/resources/codex-runtime/bin/codex.exe').Path
          $smokeHome = Join-Path $env:RUNNER_TEMP 'lingzhi-codex-provider-smoke'
          if (Test-Path $smokeHome) { Remove-Item $smokeHome -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeHome | Out-Null

          @'
          model_provider = "codex"
          model = "gpt-5.4"
          model_reasoning_effort = "high"
          disable_response_storage = true

          [model_providers.codex]
          name = "codex"
          base_url = "https://new.aicode.us.com/v1"
          wire_api = "responses"
          requires_openai_auth = true
          '@ | Set-Content -LiteralPath (Join-Path $smokeHome 'config.toml') -Encoding utf8NoBOM

          $env:CODEX_HOME = $smokeHome
          $env:LINGZHI_CODEX_HOME = $smokeHome
          $env:OPENAI_API_KEY = $env:LINGZHI_BUNDLED_OPENAI_API_KEY
          $env:LINGZHI_BUNDLED_OPENAI_API_KEY | & $codexExe login --with-api-key | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Codex API-key login smoke test failed' }

          $output = & $codexExe exec --skip-git-repo-check --sandbox read-only --json 'Reply exactly with WINDOWS_PROVIDER_OK.' 2>&1
          $exitCode = $LASTEXITCODE
          $safeOutput = (($output | Out-String) -replace 'sk-[A-Za-z0-9]+', 'sk-REDACTED')
          Write-Host $safeOutput
          if ($exitCode -ne 0) { throw "Packaged Codex provider smoke test exited with $exitCode" }
          if ($safeOutput -notmatch 'WINDOWS_PROVIDER_OK') { throw 'Packaged Codex provider smoke test returned unexpected output' }

      - name: Audit Windows artifact
        run: npm run desktop:audit:artifact

      - name: Build share package
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          $exe = Get-ChildItem release -Filter '*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No Windows installer exe found in release/' }

          $shareDir = "release/Lingzhi-Lab-$version-win-x64-share"
          if (Test-Path $shareDir) { Remove-Item $shareDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $shareDir | Out-Null

          Copy-Item $exe.FullName -Destination (Join-Path $shareDir $exe.Name) -Force
          Copy-Item packaging/windows/INSTALL-WINDOWS.zh-CN.txt -Destination $shareDir -Force
          Copy-Item packaging/windows/Collect-Lingzhi-Lab-Logs.ps1 -Destination $shareDir -Force

          $hashLines = Get-ChildItem $shareDir -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $shareDir 'SHA256SUMS.txt') -Encoding UTF8

          $zipPath = "$shareDir.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $shareDir '*') -DestinationPath $zipPath -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Upload Windows share package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-share
          path: release/*-share.zip
          if-no-files-found: error
